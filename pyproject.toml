[project]
name = "toc-memex"
version = "0.2.0"
description = "Toc Memex: a local-first AI memory over your documents (OCR + TOC + BM25)"
requires-python = ">=3.12,<3.14"
authors = [{ name = "111aligiant", email = "302075143+111aligiant@users.noreply.github.com" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.7.0",
    "jieba>=0.42.1",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "pypdfium2>=5",
    "PyPDF2>=3.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "mcp>=2.3.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pywin32>=306; sys_platform == 'win32'",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.33",
]

[project.scripts]
toc-memex = "app.cli:main"
toc-memex-mcp = "app.mcp_server:main"
toc-memex-web = "app.web_api:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "vendor*"]

[tool.setuptools.package-data]
app = [
  "inspector_ui/*.html",
  "inspector_ui/*.css",
  "inspector_ui/*.js",
  "web_dist/*",
  "web_dist/assets/*",
]
