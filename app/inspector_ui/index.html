<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toc Memex Inspector</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 11h14M9 16h10M9 21h14' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7"/><path d="M9 11h14M9 16h10M9 21h14"/></svg>
      </div>
      <div class="brand-copy">
        <h1>Toc Memex Inspector</h1>
        <p>目录 / 切片质量校检</p>
      </div>
    </div>
    <div class="top-stats" id="top-stats"></div>
    <div class="top-actions">
      <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <aside class="pane docs-pane">
      <div class="pane-head">
        <h2>文档</h2>
        <span class="count" id="doc-count">—</span>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="doc-search" type="search" placeholder="筛选文档…" autocomplete="off">
      </div>
      <div class="doc-list" id="doc-list">
        <div class="empty">加载中…</div>
      </div>
    </aside>

    <aside class="pane outline-pane">
      <div class="pane-head">
        <h2>目录</h2>
        <div class="pane-actions">
          <span class="count" id="node-count">—</span>
          <button class="text-btn" id="expand-toggle" title="展开 / 折叠">展开</button>
        </div>
      </div>
      <div class="outline" id="outline">
        <div class="empty">选择文档</div>
      </div>
      <div class="checks" id="checks"></div>
    </aside>

    <section class="pane work-pane">
      <div class="work-head">
        <div class="doc-summary" id="doc-summary">
          <h2>未选择文档</h2>
          <p>从左侧选择一份文档，查看目录、切片和校验结果。</p>
        </div>
        <div class="filters">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="chunk-search" type="search" placeholder="搜索切片内容或标题（/）" autocomplete="off">
          </div>
          <select id="chunk-filter" aria-label="切片筛选">
            <option value="all">全部切片</option>
            <option value="orphan">未归属节点</option>
            <option value="short">短切片（&lt;50 字）</option>
            <option value="node">当前目录节点</option>
          </select>
          <label class="check-label"><input type="checkbox" id="include-subtree" checked> 含子节点</label>
          <button class="text-btn" id="export-reviews" title="导出当前文档的复核结果">导出复核</button>
        </div>
      </div>

      <div class="coverage-wrap">
        <div class="coverage-head">
          <span>页面覆盖</span>
          <span class="muted" id="coverage-note"></span>
        </div>
        <div class="coverage" id="coverage"></div>
      </div>

      <div class="work-body">
        <div class="chunk-list" id="chunk-list">
          <div class="empty">选择文档</div>
        </div>
        <aside class="detail" id="detail">
          <div class="empty">选择切片查看详情</div>
        </aside>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
