<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" role="img" aria-labelledby="title desc">
  <title id="title">外部 agent 接入与活动可视化</title>
  <desc id="desc">WorkBuddy 与 DSH 通过 MCP 接入 Toc Memex，调用归档为任务时间线，并可在测试台逐步回放。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1000" height="310" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <g fill="#eef4ff" stroke="#93b4f7" stroke-width="1.5">
      <rect x="90" y="18" width="230" height="58" rx="8"/>
      <rect x="680" y="18" width="230" height="58" rx="8"/>
    </g>
    <g fill="#1f2937" font-size="17" font-weight="600">
      <text x="205" y="44">WorkBuddy</text>
      <text x="795" y="44">DSH</text>
    </g>
    <g fill="#6b7280" font-size="12">
      <text x="205" y="63">~/.workbuddy/mcp.json</text>
      <text x="795" y="63">dsh bundle · profile</text>
    </g>

    <g stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
      <path d="M 205 76 V 96 H 440 V 112"/>
      <path d="M 795 76 V 96 H 560 V 112"/>
      <path d="M 500 170 V 192"/>
      <path d="M 420 254 V 270 H 260 V 280"/>
      <path d="M 580 254 V 270 H 740 V 280"/>
    </g>

    <rect x="340" y="112" width="320" height="58" rx="8" fill="#f5f7fa" stroke="#2563eb" stroke-width="1.5"/>
    <text x="500" y="137" fill="#1f2937" font-size="16" font-weight="600">toc-memex-mcp</text>
    <text x="500" y="157" fill="#6b7280" font-size="12">stdio · streamable-http · 默认 8 个工具</text>

    <rect x="320" y="192" width="360" height="62" rx="8" fill="#f5f7fa" stroke="#2563eb" stroke-width="1.5"/>
    <text x="500" y="217" fill="#1f2937" font-size="16" font-weight="600">Toc Memex · 本地 SQLite</text>
    <text x="500" y="238" fill="#6b7280" font-size="12">doc_id → node_id → page · 检索 / 手记 / 勘误</text>

    <g fill="#f0fbf5" stroke="#7cc79b" stroke-width="1.5">
      <rect x="90" y="280" width="340" height="26" rx="6"/>
      <rect x="570" y="280" width="340" height="26" rx="6"/>
    </g>
    <g fill="#276749" font-size="13" font-weight="600">
      <text x="260" y="298">任务 · 外部会话时间线</text>
      <text x="740" y="298">测试台 · 逐步回放</text>
    </g>
  </g>
</svg>
